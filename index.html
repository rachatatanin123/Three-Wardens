<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Three Trials — Sundered Crown</title>
<style>
  :root{
    --ash:#0b0e14;
    --pale:#dfe3ea;
    --dim:#8b95a6;
    --gold:#c9a24a;
    --rust:#b23a34;
    --venom:#6fb36a;
    --pyre:#d1682f;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:radial-gradient(120% 90% at 50% 0%, #1a2130 0%, var(--ash) 55%, #05070b 100%);
    color:var(--pale);
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Noto Serif Thai",serif;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  #wrap{position:relative;width:100%;max-width:1000px;padding:12px}
  #frame{
    position:relative;width:100%;aspect-ratio:8/5;
    border:1px solid #263042;border-radius:2px;background:#05070b;
    box-shadow:0 0 0 1px #0d121b, 0 30px 80px -30px #000;overflow:hidden;
  }
  canvas{display:block;width:100%;height:100%;touch-action:none}

  .veil{
    position:absolute;inset:0;display:none;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
    padding:20px;overflow:auto;
    background:linear-gradient(180deg,rgba(5,7,11,.86),rgba(5,7,11,.95));
    z-index:3;
  }
  .veil.on{display:flex}
  .eyebrow{
    font-family:ui-sans-serif,"Helvetica Neue",Arial,"Noto Sans Thai",sans-serif;
    font-size:10px;letter-spacing:.42em;text-transform:uppercase;color:#7d8798;margin:0 0 12px;
  }
  h1{margin:0;font-weight:400;font-size:clamp(24px,4.4vw,44px);letter-spacing:.14em;
     text-transform:uppercase;line-height:1.05}
  h1 .frag{color:var(--gold)}
  .rule{width:110px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:16px 0}
  .lede{max-width:46ch;margin:0 0 18px;font-size:14px;line-height:1.6;color:#a8b1c0}
  .hint{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;
        color:#69727f;margin-top:16px;letter-spacing:.08em}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

  button{font:inherit;cursor:pointer}
  .cta{
    font-size:12px;letter-spacing:.24em;text-transform:uppercase;
    color:var(--ash);background:var(--gold);border:0;border-radius:1px;padding:12px 26px;
  }
  .cta:hover{background:#dcb457}
  .ghost{
    font-size:12px;letter-spacing:.24em;text-transform:uppercase;
    color:var(--dim);background:transparent;border:1px solid #2c364a;
    border-radius:1px;padding:12px 26px;
  }
  .ghost:hover{color:var(--pale);border-color:#46536b}
  button:focus-visible{outline:2px solid var(--pale);outline-offset:3px}

  /* ---------- boss select ---------- */
  .cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%;max-width:760px;margin:4px 0 6px}
  .card{
    --acc:var(--gold);
    position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;
    padding:16px 14px 14px;text-align:left;
    background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.008));
    border:1px solid #232c3c;border-radius:2px;color:var(--pale);
    transition:border-color .14s ease, transform .14s ease, background .14s ease;
  }
  .card:hover,.card:focus-visible{border-color:var(--acc);transform:translateY(-2px)}
  .card .num{
    position:absolute;top:12px;right:12px;
    font-family:ui-monospace,monospace;font-size:10px;color:#5c667a;letter-spacing:.1em;
  }
  .card svg{color:var(--acc);margin-bottom:2px}
  .cname{font-size:15px;letter-spacing:.06em;line-height:1.2}
  .cthai{font-family:"Noto Sans Thai","Sarabun",Tahoma,sans-serif;font-size:11.5px;color:var(--acc);opacity:.9}
  .ctag{font-family:ui-sans-serif,Arial,"Noto Sans Thai",sans-serif;font-size:11px;color:var(--dim);line-height:1.5}
  .cbeat{
    margin-top:6px;padding-top:8px;border-top:1px solid #1d2532;width:100%;
    font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.12em;
    text-transform:uppercase;color:#5c667a;
  }
  .cbeat.done{color:var(--acc)}
  .card.locked{opacity:.5;cursor:default;border-style:dashed}
  .card.locked:hover{transform:none;border-color:#232c3c}
  .card.locked .cname,.card.locked .cthai{color:#5c667a}
  .card.secret{
    border-color:#3d2f5c;
    background:linear-gradient(180deg,rgba(201,166,255,.08),rgba(201,166,255,.015));
    box-shadow:0 0 0 1px rgba(201,166,255,.12), 0 0 26px -12px rgba(201,166,255,.5);
  }

  /* ---------- touch pad ---------- */
  #touch{position:absolute;inset:0;display:none;z-index:2}
  body.touch #touch{display:block}
  #stick{position:absolute;left:4%;bottom:6%;width:112px;height:112px;border-radius:50%;
         border:1px solid rgba(201,162,74,.35);background:rgba(13,18,27,.35)}
  #nub{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;
       border-radius:50%;background:rgba(223,227,234,.28);border:1px solid rgba(223,227,234,.4)}
  .btn{position:absolute;width:60px;height:60px;border-radius:50%;
       border:1px solid rgba(201,162,74,.4);background:rgba(13,18,27,.42);color:#cfd6e0;
       font-family:ui-sans-serif,Arial,sans-serif;font-size:9.5px;letter-spacing:.1em;
       display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}
  .btn.down{background:rgba(201,162,74,.3);color:#fff}
  #bLight{right:19%;bottom:21%} #bHeavy{right:4%;bottom:21%}
  #bRoll{right:4%;bottom:3%}   #bFlask{right:19%;bottom:3%}
  #bParry{right:33%;bottom:12%;border-color:rgba(255,248,225,.5)}

  @media (max-width:620px){
    .cards{grid-template-columns:1fr;max-width:420px}
    .card{flex-direction:row;align-items:center;gap:12px;flex-wrap:wrap;padding:12px}
    .card svg{width:30px;height:30px}
    .cbeat{margin-top:0;padding-top:0;border-top:0;width:auto}
  }
  @media (prefers-reduced-motion:reduce){.card,.cta{transition:none}}
</style>
</head>
<body>
<div id="wrap">
  <div id="frame">
    <canvas id="c" width="960" height="600" aria-label="Boss arena"></canvas>

    <div id="touch">
      <div id="stick"><div id="nub"></div></div>
      <div class="btn" id="bLight">SLASH</div>
      <div class="btn" id="bHeavy">HEAVY</div>
      <div class="btn" id="bRoll">ROLL</div>
      <div class="btn" id="bFlask">FLASK</div>
      <div class="btn" id="bParry">PARRY</div>
    </div>

    <!-- ============ boss select ============ -->
    <div class="veil on" id="vMenu">
      <p class="eyebrow">Choose a trial</p>
      <h1 id="menuTitle">Three <span class="frag">Wardens</span></h1>
      <div class="rule"></div>
      <div class="cards" id="cards"></div>
      <p class="hint" id="menuHint">WASD move · J slash · K heavy · L parry · Space roll · F flask · Esc back · 1–3 to pick</p>
    </div>

    <!-- ============ defeat ============ -->
    <div class="veil" id="vDead">
      <p class="eyebrow">The trial ends</p>
      <h1 style="color:var(--rust)">You have fallen</h1>
      <div class="rule" style="background:linear-gradient(90deg,transparent,var(--rust),transparent)"></div>
      <p class="lede" id="deadNote"></p>
      <div class="row">
        <button class="cta" id="bRetry">Try again</button>
        <button class="ghost" id="bMenu1">Choose another</button>
      </div>
      <p class="hint">R retries · Esc returns to the trials</p>
    </div>

    <!-- ============ victory ============ -->
    <div class="veil" id="vWin">
      <p class="eyebrow">The trial ends</p>
      <h1 id="winTitle"></h1>
      <div class="rule"></div>
      <p class="lede" id="winNote"></p>
      <p class="hint" id="unlockNote" style="display:none;color:#c9a6ff;margin:0 0 14px"></p>
      <div class="row">
        <button class="cta" id="bAgain">Fight again</button>
        <button class="ghost" id="bSecret" style="display:none;border-color:#4a3a70;color:#c9a6ff">Enter the fourth gate</button>
        <button class="ghost" id="bMenu2">Choose another</button>
      </div>
      <p class="hint" id="winStats"></p>
    </div>
  </div>
</div>

<script>
"use strict";
(function(){
// ═══════════════════════════════════════════ core
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const W = 960, H = 600, CX = 480, CY = 306, ARENA = 262;
const TAU = Math.PI * 2;
const REDUCED = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const lerp  = (a,b,t) => a + (b-a)*t;
const rnd   = (a,b) => a + Math.random()*(b-a);
const pick  = arr => arr[(Math.random()*arr.length)|0];
const dist  = (ax,ay,bx,by) => Math.hypot(ax-bx, ay-by);
function angDiff(a,b){ let d = (b-a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
function turn(cur,target,rate){ return cur + clamp(angDiff(cur,target), -rate, rate); }
function segDist(px,py,x1,y1,x2,y2){
  const dx = x2-x1, dy = y2-y1, L = dx*dx + dy*dy;
  const t = L ? clamp(((px-x1)*dx + (py-y1)*dy)/L, 0, 1) : 0;
  return Math.hypot(px - (x1+dx*t), py - (y1+dy*t));
}
function inArena(x,y,pad){
  const d = dist(x,y,CX,CY), max = ARENA - (pad||0);
  if (d <= max) return {x,y};
  const k = max/d;
  return { x: CX + (x-CX)*k, y: CY + (y-CY)*k };
}

// ═══════════════════════════════════════════ input
const keys = Object.create(null);
const buf = { light:0, heavy:0, roll:0, flask:0, parry:0 };
const stickVec = { x:0, y:0 };
const MOVE_KEYS = { KeyW:"up", ArrowUp:"up", KeyS:"down", ArrowDown:"down",
                    KeyA:"left", ArrowLeft:"left", KeyD:"right", ArrowRight:"right" };

addEventListener("keydown", e => {
  if (e.repeat){ if (MOVE_KEYS[e.code]) e.preventDefault(); return; }
  const m = MOVE_KEYS[e.code];
  if (m){ keys[m] = true; e.preventDefault(); return; }
  switch(e.code){
    case "KeyJ": buf.light = .18; e.preventDefault(); break;
    case "KeyK": buf.heavy = .18; e.preventDefault(); break;
    case "Space": buf.roll = .18; e.preventDefault(); break;
    case "KeyF": buf.flask = .18; e.preventDefault(); break;
    case "KeyL": buf.parry = .16; e.preventDefault(); break;
    case "KeyR": if (game.state !== "menu") start(game.bossId); break;
    case "Escape": toMenu(); break;
    case "Digit1": if (game.state === "menu") start("warden"); break;
    case "Digit2": if (game.state === "menu") start("cantor"); break;
    case "Digit3": if (game.state === "menu") start("serpent"); break;
    case "Digit4": if (game.state === "menu" && unlocked()) start(SECRET); break;
  }
});
addEventListener("keyup", e => { const m = MOVE_KEYS[e.code]; if (m) keys[m] = false; });
addEventListener("blur", () => { for (const k in keys) keys[k] = false; stickVec.x = stickVec.y = 0; });
cv.addEventListener("contextmenu", e => e.preventDefault());
cv.addEventListener("pointerdown", e => {
  if (e.pointerType === "touch") return;
  if (game.state !== "play") return;
  if (e.button === 2) buf.parry = .16; else buf.light = .18;
  e.preventDefault();
});

if ("ontouchstart" in window || navigator.maxTouchPoints > 0) document.body.classList.add("touch");
const stick = document.getElementById("stick"), nub = document.getElementById("nub");
let stickId = null;
stick.addEventListener("pointerdown", e => { stickId = e.pointerId; stick.setPointerCapture(e.pointerId); moveStick(e); e.preventDefault(); });
stick.addEventListener("pointermove", e => { if (e.pointerId === stickId) moveStick(e); });
function endStick(e){
  if (e.pointerId !== stickId) return;
  stickId = null; stickVec.x = stickVec.y = 0; nub.style.transform = "translate(0px,0px)";
}
stick.addEventListener("pointerup", endStick);
stick.addEventListener("pointercancel", endStick);
function moveStick(e){
  const r = stick.getBoundingClientRect();
  let dx = e.clientX - (r.left + r.width/2), dy = e.clientY - (r.top + r.height/2);
  const max = r.width/2, len = Math.hypot(dx,dy) || 1;
  if (len > max){ dx = dx/len*max; dy = dy/len*max; }
  stickVec.x = dx/max; stickVec.y = dy/max;
  nub.style.transform = "translate(" + dx.toFixed(1) + "px," + dy.toFixed(1) + "px)";
}
function padBtn(id,key){
  const el = document.getElementById(id);
  el.addEventListener("pointerdown", e => { buf[key] = .18; el.classList.add("down"); e.preventDefault(); });
  const up = () => el.classList.remove("down");
  el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up); el.addEventListener("pointerleave", up);
}
padBtn("bLight","light"); padBtn("bHeavy","heavy"); padBtn("bRoll","roll"); padBtn("bFlask","flask"); padBtn("bParry","parry");

// ═══════════════════════════════════════════ shared combat values
const ATK = {
  light:{ wind:.11, act:.10, rec:.22, dmg:38, poise:20, reach:74, spread:1.7, stam:16, step:120 },
  heavy:{ wind:.34, act:.14, rec:.46, dmg:84, poise:52, reach:94, spread:2.1, stam:32, step:180 }
};
const PLAYER_MAX_HP = 120, FLASK_HEAL = 46, FLASKS = 4;
// A parry turns steel and bolts only — never the ground, never the light.
// The window is the first slice of the animation; whiff it and the recovery is yours to regret.
const PARRY = { total:.46, act:.16, stam:12, poise:46, refund:20, inv:.28, arc:1.25 };

const game = { state:"menu", bossId:"warden", t:0, time:0, shake:0, endT:0, hits:0, taken:0, parries:0, freeze:0 };
const progress = { warden:null, cantor:null, serpent:null, hollow:null };   // session only
let player, boss, hazards, teles, parts, embers, pending;

// ═══════════════════════════════════════════ delayed events
function schedule(t,fn){ pending.push({ t, fn }); }

// ═══════════════════════════════════════════ the echo (hidden boss only)
// A shadow standing where the boss stood ECHO.delay ago repeats each swing a beat later.
const ECHO = { on:false, delay:1.2, replaying:false };
function echoPos(b){
  if (!b.trail.length) return { x:b.x, y:b.y };
  const i = clamp(b.trail.length-1 - Math.round(ECHO.delay*60), 0, b.trail.length-1);
  return b.trail[i];
}
function echoOffset(){
  if (!ECHO.on || ECHO.replaying || !boss || boss.dead || boss.action === "remember") return null;
  const e = echoPos(boss), dx = e.x-boss.x, dy = e.y-boss.y;
  return Math.hypot(dx,dy) < 26 ? null : { dx, dy };
}

// ═══════════════════════════════════════════ hazard factories
function arc(x,y,ang,spread,r0,r1,dmg,life,delay){
  hazards.push({ kind:"arc", x,y,ang,spread,r0,r1,dmg, age:0, life, delay: delay||0, hit:false });
  const o = echoOffset();
  if (o) schedule(ECHO.delay*.5, () => {
    ECHO.replaying = true;
    arc(x+o.dx, y+o.dy, ang, spread, r0, r1, Math.round(dmg*.55), life, Math.max(delay||0,.32));
    ECHO.replaying = false;
  });
}
function ring(x,y,rMax,speed,dmg,thick,col){
  hazards.push({ kind:"ring", x,y, r:14, rMax, speed, dmg, thick, age:0, hit:false, col: col||"pyre" });
  const o = echoOffset();
  if (o) schedule(ECHO.delay*.5, () => {
    ECHO.replaying = true;
    ring(x+o.dx, y+o.dy, rMax, speed, Math.round(dmg*.55), thick, col);
    ECHO.replaying = false;
  });
}
function orbs(x,y,n,speed,dmg,offset,col){
  for (let i=0;i<n;i++){
    const a = offset + i*TAU/n;
    hazards.push({ kind:"orb", x,y, vx:Math.cos(a)*speed, vy:Math.sin(a)*speed, r:8, dmg, age:0, life:4.5, col: col||"pyre" });
  }
}
function bloom(x,y,r,delay,dmg,leaves){
  const p = inArena(x,y,10);
  hazards.push({ kind:"bloom", x:p.x, y:p.y, r, delay, dmg, age:0, done:false, leaves: !!leaves });
}
function pool(x,y,r,dmg,life){
  const p = inArena(x,y,10);
  hazards.push({ kind:"pool", x:p.x, y:p.y, r, dmg, age:0, life, tick:0, bub: rnd(0,TAU) });
}
function beam(x,y,ang,vel,len,dmg,life){
  hazards.push({ kind:"beam", x,y,ang,vel,len,dmg, age:0, life, cd:0 });
}
function tele(kind,x,y,ang,spread,r1,life){
  teles.push({ kind,x,y,ang,spread,r1, age:0, life });
}
function burstParts(x,y,n,col,spd){
  if (REDUCED) n = Math.min(n,4);
  for (let i=0;i<n;i++){
    const a = rnd(0,TAU), s = rnd(spd*.3, spd);
    parts.push({ x,y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:rnd(.25,.6), age:0, col, sz:rnd(1.2,3.2) });
  }
}
function shake(v){ if (!REDUCED) game.shake = Math.min(game.shake + v, 22); }
function faceP(b,rate){ b.ang = turn(b.ang, Math.atan2(player.y-b.y, player.x-b.x), rate); }
function blink(b,range,spread){
  const a = Math.atan2(b.y-player.y, b.x-player.x) + rnd(-spread, spread);
  const p = inArena(player.x + Math.cos(a)*range, player.y + Math.sin(a)*range, b.r + 6);
  burstParts(b.x,b.y,10,b.def.dust,180);
  b.x = p.x; b.y = p.y;
  b.trail.length = 0;
  b.ang = Math.atan2(player.y-b.y, player.x-b.x);
  burstParts(b.x,b.y,10,b.def.dust,180);
}
function swingAt(b,off,spread,r1,dmg,life,delay){
  arc(b.x + Math.cos(b.ang)*off, b.y + Math.sin(b.ang)*off, b.ang, spread, 10, r1, dmg, life, delay);
}

// ═══════════════════════════════════════════ BOSS I — the Warden
const WARDEN = {
  id:"warden", n:1, name:"The Sundered Crown", thai:"ผู้เฝ้ามงกุฎแตกร้าว",
  tag:"Greatsword. Slow, heavy, readable — break its poise, then punish.",
  hp:1050, spd:1, r:27, poiseMax:100, poiseRegen:13, phase2At:.5, awaken:"awaken",
  acc:"#c9a24a", acc2:"#b23a34", dust:"gold", tint:"#161d2b",
  range:{ min:74, max:96 },
  phase2Label:"UNBOUND",
  acts:{
    lunge(){ return { dur:1.45, faceUntil:.5, blade:[[.15,.5,.95,-1.5],[.5,.66,-1.5,1.5],[.66,1,1.5,.95]],
      events:[
        { t:.34, f(b){ tele("arc", b.x+Math.cos(b.ang)*40, b.y+Math.sin(b.ang)*40, b.ang, 1.15, 112, .3); } },
        { t:.56, f(b){ b.sx = Math.cos(b.ang)*640; b.sy = Math.sin(b.ang)*640; } },
        { t:.64, f(b){ swingAt(b,40,1.15,112,24,.16); shake(6); } }
      ]}; },
    combo(){ return { dur:2, faceUntil:1.15,
      blade:[[.1,.3,.95,-1.3],[.3,.42,-1.3,1.4],[.55,.78,1.4,-1.4],[.78,.9,-1.4,1.2],[1.05,1.36,1.2,-2.2],[1.36,1.5,-2.2,2.2],[1.5,2,2.2,.95]],
      events:[
        { t:.22, f(b){ tele("arc", b.x+Math.cos(b.ang)*34, b.y+Math.sin(b.ang)*34, b.ang, 1.5, 92, .22); } },
        { t:.42, f(b){ swingAt(b,34,1.5,92,17,.14); b.sx = Math.cos(b.ang)*180; b.sy = Math.sin(b.ang)*180; shake(4); } },
        { t:.70, f(b){ tele("arc", b.x+Math.cos(b.ang)*34, b.y+Math.sin(b.ang)*34, b.ang, 1.5, 92, .2); } },
        { t:.90, f(b){ swingAt(b,34,1.5,92,17,.14); b.sx = Math.cos(b.ang)*180; b.sy = Math.sin(b.ang)*180; shake(4); } },
        { t:1.16, f(b){ tele("arc", b.x+Math.cos(b.ang)*34, b.y+Math.sin(b.ang)*34, b.ang, 2.4, 118, .3); } },
        { t:1.48, f(b){ swingAt(b,34,2.4,118,26,.14); shake(8); } }
      ]}; },
    slam(){ return { dur:2.05, faceUntil:.5, blade:[[.1,.55,.95,-2.4],[.9,1.02,-2.4,0],[1.02,2.05,0,.95]],
      events:[
        { t:.42, f(b){ const p = inArena(player.x, player.y, 30); b.tx = p.x; b.ty = p.y;
                       tele("ring", b.tx, b.ty, 0, 0, 96, .62); } },
        { t:.55, f(b){ b.jx = b.x; b.jy = b.y; } },
        { t:1.04, f(b){ ring(b.x,b.y,236,520,32,26); burstParts(b.x,b.y,22,"ember",260); shake(16); } }
      ],
      move(b,t){
        if (t >= .55 && t <= 1.04){ const u = (t-.55)/.49; b.x = lerp(b.jx,b.tx,u); b.y = lerp(b.jy,b.ty,u); b.hop = Math.sin(u*Math.PI)*54; }
        else b.hop = 0;
      }}; },
    sweep(){ return { dur:1.72, faceUntil:.34, blade:[[.1,.42,.95,-1.2]],
      events:[
        { t:.36, f(b){ tele("ring", b.x, b.y, 0, 0, 140, .34); } },

function newBoss(id){
  const def = DEFS[id];
  const b = { def, x:CX, y:CY-140, ang:Math.PI/2, r:def.r, hp:def.hp, maxHp:def.hp, phase:1,
              action:null, cur:null, t:0, fired:0, cool:1.2,
              poise:0, stagger:0, inv:0, ward:0, wardMax:110,
              dead:false, deathT:0, blade:.95, flash:0, spin:0, hop:0,
              sx:0, sy:0, tx:0, ty:0, jx:0, jy:0, orbA:0, orbDir:1,
              trail:[], trailCap: def.echo ? 110 : 16,
              aspect:0, range:null, spdMul:null, timeScale:1 };
  if (def.aspects) applyAspect(b);
  return b;
}
function resetWorld(id){
  if (!DEFS[id] || (DEFS[id].secret && !unlocked())) id = "warden";
  game.flaskMax = DEFS[id].flasks || FLASKS;
  player = newPlayer(); boss = newBoss(id);
  ECHO.on = !!DEFS[id].echo; ECHO.replaying = false;
  hazards = []; teles = []; parts = []; pending = [];
  embers = Array.from({length: REDUCED ? 10 : 34}, () => ({ x:rnd(0,W), y:rnd(0,H), v:rnd(6,22), s:rnd(.6,1.9), p:rnd(0,TAU) }));
  game.bossId = id; game.time = 0; game.shake = 0; game.endT = 0; game.hits = 0; game.taken = 0;
  game.parries = 0; game.freeze = 0;
  buf.light = buf.heavy = buf.roll = buf.flask = buf.parry = 0;
}
function veil(id){
  for (const v of ["vMenu","vDead","vWin"]) document.getElementById(v).classList.toggle("on", v === id);
}
function start(id){ resetWorld(id); game.state = "play"; veil(null); }
function toMenu(){ resetWorld(game.bossId); game.state = "menu"; buildCards(); veil("vMenu"); }

document.getElementById("bRetry").addEventListener("click", () => start(game.bossId));
document.getElementById("bAgain").addEventListener("click", () => start(game.bossId));
document.getElementById("bSecret").addEventListener("click", () => { if (unlocked()) start(SECRET); });
document.getElementById("bMenu1").addEventListener("click", toMenu);
document.getElementById("bMenu2").addEventListener("click", toMenu);

const ROMAN = ["I","II","III","IV"];
function buildCards(){
  const host = document.getElementById("cards");
  host.textContent = "";
  const open4 = unlocked();

  document.getElementById("menuTitle").innerHTML =
    open4 ? 'Four <span class="frag">Wardens</span>' : 'Three <span class="frag">Wardens</span>';
  document.getElementById("menuHint").textContent =
    "WASD move · J slash · K heavy · L parry · Space roll · F flask · Esc back · 1\u2013" + (open4 ? "4" : "3") + " to pick";

  const cardFor = (id,i) => {
    const d = DEFS[id], best = progress[id];
    const el = document.createElement("button");
    el.className = "card";
    el.style.setProperty("--acc", d.acc);
    el.innerHTML =
      '<span class="num">' + ROMAN[i] + '</span>' +
      '<svg width="40" height="40" viewBox="0 0 44 40" aria-hidden="true">' + SIGILS[id] + '</svg>' +
      '<span class="cname">' + d.name + '</span>' +
      '<span class="cthai">' + d.thai + '</span>' +
      '<span class="ctag">' + d.tag + '</span>' +
      '<span class="cbeat' + (best ? ' done' : '') + '">' + (best ? 'Unmade · ' + best.toFixed(1) + 's' : d.hp + ' vigor') + '</span>';
    el.addEventListener("click", () => start(id));
    return el;
  };

  ORDER.forEach((id,i) => host.appendChild(cardFor(id,i)));

  if (open4){
    const el = cardFor(SECRET, 3);
    el.classList.add("secret");
    host.appendChild(el);
  } else {
    const left = ORDER.filter(id => progress[id] == null).length;
    const el = document.createElement("button");
    el.className = "card locked";
    el.disabled = true;
    el.innerHTML =
      '<span class="num">IV</span>' +
      '<svg width="40" height="40" viewBox="0 0 44 40" aria-hidden="true">' + SIGILS.locked + '</svg>' +
      '<span class="cname">Sealed</span>' +
      '<span class="cthai">ประตูที่สี่</span>' +
      '<span class="ctag">Something waits behind the throne. Unmake all three wardens to open the fourth gate.</span>' +
      '<span class="cbeat">' + left + ' warden' + (left === 1 ? '' : 's') + ' remain</span>';
    host.appendChild(el);
  }
}

// ═══════════════════════════════════════════ update
function update(dt){
  game.time += dt;
  for (const k in buf) if (buf[k] > 0) buf[k] = Math.max(0, buf[k]-dt);
  game.shake *= Math.pow(.0016, dt);
  if (game.shake < .2) game.shake = 0;

  for (let i = pending.length-1; i >= 0; i--){
    const s = pending[i];
    s.t -= dt;
    if (s.t <= 0){ pending.splice(i,1); s.fn(); }
  }

  updatePlayer(dt);
  updateBoss(dt);
  updateHazards(dt);

  for (const t of teles) t.age += dt;
  for (let i = teles.length-1; i >= 0; i--) if (teles[i].age >= teles[i].life) teles.splice(i,1);
  for (let i = parts.length-1; i >= 0; i--){
    const p = parts[i]; p.age += dt;
    if (p.age >= p.life){ parts.splice(i,1); continue; }
    p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= .93; p.vy *= .93; p.vy += 40*dt;
  }
  for (const e of embers){ e.y -= e.v*dt; e.x += Math.sin(game.time*.6+e.p)*6*dt; if (e.y < -6){ e.y = H+6; e.x = rnd(0,W); } }

  if (game.state === "play"){
    if (player.hp <= 0){ game.state = "dying"; game.endT = 0; shake(14); burstParts(player.x,player.y,20,"rust",200); }
    else if (boss.hp <= 0 && !boss.dead){ boss.dead = true; boss.action = null; boss.cur = null; hazards.length = 0; pending.length = 0; shake(18); }
  }
  if (boss.dead){
    boss.deathT += dt;
    if (boss.deathT < 1.5 && Math.random() < dt*22) burstParts(boss.x+rnd(-24,24), boss.y+rnd(-24,24), 3, boss.def.dust, 150);
    if (boss.deathT > 1.7 && game.state === "play"){
      game.state = "won";
      const prev = progress[boss.def.id];
      if (!prev || game.time < prev) progress[boss.def.id] = game.time;
      document.getElementById("winTitle").innerHTML = boss.def.name + ' is <span class="frag">unmade</span>';
      document.getElementById("winNote").textContent = boss.def.thai + " ล้มลงแล้ว — the arena goes quiet.";
      document.getElementById("winStats").textContent =
        game.time.toFixed(1) + "s  ·  " + game.hits + " strikes  ·  " + game.parries + " parried  ·  "
        + game.taken + " taken  ·  " + player.flasks + " flasks left";
      const note = document.getElementById("unlockNote");
      const gate = document.getElementById("bSecret");
      const openNow = unlocked() && boss.def.id !== SECRET;
      note.style.display = openNow ? "block" : "none";
      gate.style.display = openNow ? "inline-block" : "none";
      note.textContent = progress[SECRET]
        ? "The fourth gate stands open."
        : "All three wardens are unmade. Something behind the throne is awake.";
      if (boss.def.id === SECRET){
        document.getElementById("winNote").textContent =
          "มงกุฎกลวงไร้นาม ล้มลงแล้ว — the crown has no one left to wear it.";
      }
      veil("vWin");
    }
  }
  if (game.state === "dying"){
    game.endT += dt;
    if (game.endT > 1.3){
      game.state = "dead";
      const pct = Math.round(boss.hp/boss.maxHp*100);
      document.getElementById("deadNote").textContent =
        (pct > 60 ? "It barely turned to watch you fall." : pct > 25 ? "It was wounded. That was almost enough." : "One more strike would have done it.")
        + "  " + boss.def.name + " keeps its post — " + pct + "% left.";
      veil("vDead");
    }
  }
}

const canAct = p => !p.atk && p.roll <= 0 && p.heal <= 0 && p.parry <= 0;

function updatePlayer(dt){
  const p = player;
  if (game.state !== "play"){ p.inv = Math.max(0,p.inv-dt); p.flash = Math.max(0,p.flash-dt*4); return; }
  p.inv = Math.max(0, p.inv-dt);
  p.flash = Math.max(0, p.flash-dt*4);
  p.stamLock = Math.max(0, p.stamLock-dt);
  p.parryFlash = Math.max(0, p.parryFlash-dt*3);
  if (p.stamLock <= 0) p.stam = Math.min(100, p.stam + 30*dt);

  let ix = (keys.right?1:0) - (keys.left?1:0);
  let iy = (keys.down?1:0) - (keys.up?1:0);
  if (Math.abs(stickVec.x) > .18 || Math.abs(stickVec.y) > .18){ ix = stickVec.x; iy = stickVec.y; }
  const mag = Math.hypot(ix,iy);
  if (mag > 1){ ix /= mag; iy /= mag; }
  const moving = Math.hypot(ix,iy) > .12;

  if (buf.roll > 0 && canAct(p) && p.stam >= 22){
    buf.roll = 0; p.stam -= 22; p.stamLock = .45; p.roll = .48; p.inv = .30;
    p.rollAng = moving ? Math.atan2(iy,ix) : p.ang; p.ang = p.rollAng;
  } else if (buf.parry > 0 && canAct(p) && p.stam >= PARRY.stam){
    buf.parry = 0; p.stam -= PARRY.stam; p.stamLock = .5; p.parry = PARRY.total;
    const toB = Math.atan2(boss.y-p.y, boss.x-p.x);
    p.ang = moving ? Math.atan2(iy,ix) : toB;
    if (Math.abs(angDiff(p.ang,toB)) < .9) p.ang = toB;
  } else if (buf.flask > 0 && canAct(p) && p.flasks > 0 && p.hp < PLAYER_MAX_HP){
    buf.flask = 0; p.flasks--; p.heal = .95; p.healDone = false;
  } else if (buf.light > 0 && canAct(p) && p.stam >= ATK.light.stam){
    buf.light = 0; startSwing("light");
  } else if (buf.heavy > 0 && canAct(p) && p.stam >= ATK.heavy.stam){
    buf.heavy = 0; startSwing("heavy");
  }

  let speed = 0;
  if (p.roll > 0){
    p.roll -= dt;
    speed = lerp(500, 40, Math.pow(clamp((.48-p.roll)/.48,0,1),2));
    ix = Math.cos(p.rollAng); iy = Math.sin(p.rollAng);
  } else if (p.parry > 0){
    p.parry -= dt;
    if (p.parry <= 0) p.parry = 0;
  } else if (p.heal > 0){
    p.heal -= dt;
    if (!p.healDone && p.heal <= .5){ p.healDone = true; p.hp = Math.min(PLAYER_MAX_HP, p.hp+FLASK_HEAL); burstParts(p.x,p.y,10,"gold",90); }
    if (p.heal <= 0) p.heal = 0;
  } else if (p.atk){
    p.atkT += dt;
    const a = ATK[p.atk];
    if (p.atkT < a.wind){ speed = a.step*(1-p.atkT/a.wind)*.5; ix = Math.cos(p.ang); iy = Math.sin(p.ang); }
    else if (p.atkT < a.wind + a.act){
      speed = a.step; ix = Math.cos(p.ang); iy = Math.sin(p.ang);
      if (!p.atkHit) tryHitBoss(a);
    } else if (p.atkT >= a.wind + a.act + a.rec){ p.atk = null; p.atkT = 0; }
  } else if (moving){
    speed = 208; p.ang = Math.atan2(iy,ix);
  }

  if (speed > 0){
    p.x += ix*speed*dt; p.y += iy*speed*dt;
    const q = inArena(p.x,p.y,p.r); p.x = q.x; p.y = q.y;
  }
  if (p.roll <= 0) p.roll = 0;

  function startSwing(kind){
    const a = ATK[kind];
    p.atk = kind; p.atkT = 0; p.atkHit = false;
    p.stam -= a.stam; p.stamLock = .5;
    if (moving) p.ang = Math.atan2(iy,ix);
    const toB = Math.atan2(boss.y-p.y, boss.x-p.x);
    if (!moving || Math.abs(angDiff(p.ang,toB)) < .8) p.ang = toB;    // soft lock-on
  }
}

const parryActive = () => player.parry > PARRY.total - PARRY.act;
function parryFacing(x,y){
  return Math.abs(angDiff(player.ang, Math.atan2(y-player.y, x-player.x))) <= PARRY.arc;
}
function canParry(x,y){ return parryActive() && parryFacing(x,y); }

function addPoise(n){
  const b = boss;
  if (b.dead || b.stagger > 0) return;
  if (b.ward > 0){
    b.ward -= n*1.2;
    if (b.ward <= 0){
      b.ward = 0; b.stagger = 1.6; b.action = null; b.cur = null; b.cool = .5;
      burstParts(b.x,b.y,24,"ember",280); shake(13);
    }
    return;
  }
  b.poise += n;
  if (b.poise >= b.def.poiseMax){
    b.poise = 0; b.stagger = 1.7; b.action = null; b.cur = null; b.cool = .5;
    burstParts(b.x,b.y,18,"gold",220); shake(10);
  }
}

function doParry(x,y){
  const p = player;
  game.parries++;
  p.inv = Math.max(p.inv, PARRY.inv);
  p.parryFlash = 1;
  p.stam = Math.min(100, p.stam + PARRY.refund);
  p.stamLock = .2;
  addPoise(PARRY.poise);
  const a = Math.atan2(y-p.y, x-p.x);
  burstParts(p.x + Math.cos(a)*20, p.y + Math.sin(a)*20, 16, "gold", 240);
  shake(6);
  if (!REDUCED) game.freeze = .07;
}

function tryHitBoss(a){
  const p = player;
  if (boss.dead) return;
  if (dist(p.x,p.y,boss.x,boss.y) > a.reach + boss.r) return;
  if (Math.abs(angDiff(p.ang, Math.atan2(boss.y-p.y, boss.x-p.x))) > a.spread/2) return;

  p.atkHit = true;
  const hx = lerp(p.x,boss.x,.7), hy = lerp(p.y,boss.y,.7);
  if (boss.inv > 0){ burstParts(hx,hy,6,"pale",120); shake(3); return; }

  const warded = boss.ward > 0;
  const crit = boss.stagger > 0;
  const dmg = Math.round(a.dmg * (crit ? 2 : 1) * (warded ? .35 : 1));
  boss.hp = Math.max(0, boss.hp - dmg);
  boss.flash = .18; game.hits++;

  if (warded){
    boss.ward -= a.poise * 1.4;
    burstParts(hx,hy,7,"ember",150); shake(3);
    if (boss.ward <= 0){
      boss.ward = 0; boss.stagger = 1.6; boss.action = null; boss.cur = null; boss.cool = .5;
      burstParts(boss.x,boss.y,24,"ember",280); shake(13);
    }
    return;
  }
  burstParts(hx,hy, crit?16:9, crit?"gold":"pale", crit?260:170);
  shake(crit ? 12 : 5);
  addPoise(a.poise);
}

function startAction(b,name){
  b.action = name; b.cur = b.def.acts[name](b);
  b.t = 0; b.fired = 0; b.sx = b.sy = 0; b.hop = 0; b.spin = 0;
  b.jx = b.x; b.jy = b.y; b.tx = b.x; b.ty = b.y;
}

function updateBoss(dt){
  const b = boss;
  b.flash = Math.max(0, b.flash-dt);
  b.inv = Math.max(0, b.inv-dt);
  if (b.dead || game.state !== "play") return;

  // movement trail (used by the serpent's tail)
  b.trail.push({ x:b.x, y:b.y });
  if (b.trail.length > b.trailCap) b.trail.shift();

  b.poise = Math.max(0, b.poise - b.def.poiseRegen*dt);

  if (b.stagger > 0){ b.stagger -= dt; b.blade = lerp(b.blade, 2.6, clamp(dt*6,0,1)); return; }
  if (b.def.aspects){
    const frac = b.hp/b.maxHp;
    let idx = 0;
    for (let i = 0; i < b.def.aspects.length; i++) if (frac <= b.def.aspects[i].at) idx = i;
    if (idx !== b.aspect){ b.aspect = idx; applyAspect(b); startAction(b, "remember"); }
  } else if (b.phase === 1 && b.hp <= b.maxHp*b.def.phase2At){ b.phase = 2; startAction(b, b.def.awaken); }

  const spd = b.def.aspects ? b.timeScale : (b.phase === 2 ? 1.14 : 1);

  if (b.action){
    b.t += dt*spd;
    const c = b.cur;
    while (b.fired < c.events.length && b.t >= c.events[b.fired].t){ c.events[b.fired].f(b); b.fired++; }
    if (b.t < c.faceUntil) faceP(b, 3.4*dt);
    if (c.move) c.move(b, b.t);

    let target = .95;
    if (c.blade) for (const seg of c.blade){
      if (b.t >= seg[0] && b.t <= seg[1]){ target = lerp(seg[2], seg[3], (b.t-seg[0])/(seg[1]-seg[0])); break; }
      if (b.t > seg[1]) target = seg[3];
    }
    b.blade = lerp(b.blade, target, clamp(dt*22,0,1));

    if (b.sx || b.sy){
      b.x += b.sx*dt; b.y += b.sy*dt;
      b.sx *= Math.pow(.02,dt); b.sy *= Math.pow(.02,dt);
      if (Math.abs(b.sx) < 4) b.sx = 0;
      if (Math.abs(b.sy) < 4) b.sy = 0;
    }
    if (b.t >= c.dur){ b.action = null; b.cur = null; b.cool = rnd(.5,1.05)/spd; }
  } else {
    b.blade = lerp(b.blade, .95, clamp(dt*8,0,1));
    b.spin = 0; b.hop = 0;
    b.cool -= dt;
    faceP(b, 2.6*dt);
    const d = dist(b.x,b.y,player.x,player.y);
    const a = Math.atan2(player.y-b.y, player.x-b.x);
    const R = b.range || b.def.range, walk = 102*(b.spdMul || b.def.spd)*spd;
    if (d > R.max){ b.x += Math.cos(a)*walk*dt; b.y += Math.sin(a)*walk*dt; }
    else if (d < R.min){ b.x -= Math.cos(a)*walk*.6*dt; b.y -= Math.sin(a)*walk*.6*dt; }
    else { b.x += Math.cos(a+Math.PI/2)*walk*.45*dt; b.y += Math.sin(a+Math.PI/2)*walk*.45*dt; }
    if (b.cool <= 0) startAction(b, b.def.pool(b,d));
  }

  const q = inArena(b.x,b.y,b.r); b.x = q.x; b.y = q.y;
}

function hurtPlayer(dmg, soft){
  const p = player;
  if (game.state !== "play") return;
  if (p.inv > 0) return;
  p.hp = Math.max(0, p.hp - dmg);
  game.taken++;
  if (soft){ p.flash = .5; burstParts(p.x,p.y,5,"venom",90); shake(2); return; }
  p.inv = .55; p.flash = 1; p.heal = 0; p.atk = null; p.atkT = 0;
  burstParts(p.x,p.y,10,"rust",180); shake(8);
}

function updateHazards(dt){
  const p = player;
  for (let i = hazards.length-1; i >= 0; i--){
    const h = hazards[i];
    h.age += dt;
    if (h.kind === "arc"){
      if (!h.hit && h.age >= h.delay){
        const d = dist(p.x,p.y,h.x,h.y);
        if (d >= h.r0-p.r && d <= h.r1+p.r &&
            (h.spread >= TAU || Math.abs(angDiff(h.ang, Math.atan2(p.y-h.y, p.x-h.x))) <= h.spread/2)){
          h.hit = true;
          if (canParry(h.x,h.y)) doParry(h.x,h.y); else hurtPlayer(h.dmg);
        }
      }
      if (h.age >= h.delay + h.life){ hazards.splice(i,1); continue; }

    } else if (h.kind === "ring"){
      h.r += h.speed*dt;
      if (!h.hit && Math.abs(dist(p.x,p.y,h.x,h.y) - h.r) <= h.thick/2 + p.r){ h.hit = true; hurtPlayer(h.dmg); }
      if (h.r >= h.rMax){ hazards.splice(i,1); continue; }

    } else if (h.kind === "orb"){
      h.x += h.vx*dt; h.y += h.vy*dt;
      if (h.mine){                                        // a bolt turned back on its caster
        if (!boss.dead && dist(boss.x,boss.y,h.x,h.y) <= h.r + boss.r){
          if (boss.inv <= 0){
            boss.hp = Math.max(0, boss.hp - 20); boss.flash = .18;
            addPoise(12);
            burstParts(h.x,h.y,10,"gold",190); shake(5);
          } else burstParts(h.x,h.y,5,"pale",120);
          hazards.splice(i,1); continue;
        }
      } else if (dist(p.x,p.y,h.x,h.y) <= h.r + p.r){
        if (canParry(h.x,h.y)){                            // deflect it
          doParry(h.x,h.y);
          const a = Math.atan2(boss.y-p.y, boss.x-p.x), sp = Math.hypot(h.vx,h.vy)*1.35 + 90;
          h.vx = Math.cos(a)*sp; h.vy = Math.sin(a)*sp;
          h.mine = true; h.leaves = false; h.col = "mine"; h.age = 0; h.life = 2.4;
          continue;
        }
        if (p.inv <= 0){
          hurtPlayer(h.dmg);
          if (h.leaves) pool(h.x,h.y,38,7,7);
          hazards.splice(i,1); continue;
        }
      }
      if (h.age >= h.life || dist(h.x,h.y,CX,CY) > ARENA + 30){
        if (h.leaves) pool(h.x,h.y,38,7,7);
        burstParts(h.x,h.y,3,h.col === "venom" ? "venom" : "ember",60);
        hazards.splice(i,1); continue;
      }

    } else if (h.kind === "bloom"){
      if (!h.done && h.age >= h.delay){
        h.done = true;
        if (dist(p.x,p.y,h.x,h.y) <= h.r + p.r*.5) hurtPlayer(h.dmg);
        burstParts(h.x,h.y,10, h.leaves ? "venom" : "ember", 170);
        if (h.leaves) pool(h.x,h.y,h.r,7,9);
        shake(4);
      }
      if (h.age >= h.delay + .3){ hazards.splice(i,1); continue; }

    } else if (h.kind === "pool"){
      h.tick -= dt;
      if (h.tick <= 0 && dist(p.x,p.y,h.x,h.y) <= h.r*.9 && p.roll <= 0){
        h.tick = .6; hurtPlayer(h.dmg, true);
      }
      if (h.age >= h.life){ hazards.splice(i,1); continue; }

    } else { // beam
      h.ang += h.vel*dt;
      h.cd -= dt;
      const x2 = h.x + Math.cos(h.ang)*h.len, y2 = h.y + Math.sin(h.ang)*h.len;
      if (h.cd <= 0 && segDist(p.x,p.y,h.x,h.y,x2,y2) <= 11 + p.r){ h.cd = .55; hurtPlayer(h.dmg); }
      if (h.age >= h.life){ hazards.splice(i,1); continue; }
    }
  }
}

// ═══════════════════════════════════════════ render
function accOf(b){ return b.def.aspects ? b.def.aspects[b.aspect].acc : (b.phase === 2 ? b.def.acc2 : b.def.acc); }
function tintOf(b){ return b.def.aspects ? b.def.aspects[b.aspect].tint : b.def.tint; }
function labelOf(b){ return b.def.aspects ? b.def.aspects[b.aspect].label : (b.phase === 2 ? b.def.phase2Label : ""); }

function drawEcho(){
  const b = boss, o = echoOffset();
  if (!o) return;
  const pulse = .18 + .1*Math.sin(game.time*4);
  ctx.save();
  ctx.translate(b.x+o.dx, b.y+o.dy);
  ctx.globalAlpha = pulse + .14;
  ctx.fillStyle = "#0a0812";
  ctx.beginPath(); ctx.arc(0,0,b.r*.9,0,TAU); ctx.fill();
  ctx.strokeStyle = accOf(b); ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(0,0,b.r*.9,0,TAU); ctx.stroke();
  ctx.strokeStyle = "rgba(201,166,255,.8)"; ctx.lineWidth = 1.2;
  ctx.beginPath();
  for (let i=0;i<=6;i++){
    const a = -Math.PI + i*Math.PI/6, x = Math.cos(a)*20, y = -34 + Math.sin(a)*7;
    if (i === 0) ctx.moveTo(x,y); else ctx.lineTo(x, y - (i%2 ? 7 : 0));
  }
  ctx.stroke();
  ctx.restore();
}

function draw(){
  ctx.save();
  ctx.clearRect(0,0,W,H);
  if (game.shake > 0) ctx.translate(rnd(-game.shake,game.shake)*.5, rnd(-game.shake,game.shake)*.5);

  drawArena();
  for (const e of embers){
    ctx.fillStyle = "rgba(201,162,74," + (.06 + .1*e.s).toFixed(3) + ")";
    ctx.beginPath(); ctx.arc(e.x,e.y,e.s,0,TAU); ctx.fill();
  }
  if (game.state !== "menu"){
    drawTeles(); drawHazards();
    if (ECHO.on && !boss.dead) drawEcho();
    if (!boss.dead || boss.deathT < 1.7) drawBoss();
    drawPlayer();
  }
  drawParts();
  ctx.restore();
  if (game.state !== "menu") drawHUD();
}

function drawArena(){
  const g = ctx.createRadialGradient(CX,CY-40,30,CX,CY,ARENA+90);
  g.addColorStop(0,"#1c2434"); g.addColorStop(.62,"#121826"); g.addColorStop(1,"#070a10");
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  ctx.save();
  ctx.beginPath(); ctx.arc(CX,CY,ARENA,0,TAU); ctx.clip();
  ctx.fillStyle = boss ? tintOf(boss) : "#161d2b"; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = "rgba(255,255,255,.032)"; ctx.lineWidth = 1;
  for (let i=1;i<7;i++){ ctx.beginPath(); ctx.arc(CX,CY,ARENA*i/7,0,TAU); ctx.stroke(); }
  for (let i=0;i<16;i++){
    const a = i*TAU/16;
    ctx.beginPath(); ctx.moveTo(CX+Math.cos(a)*38, CY+Math.sin(a)*38);
    ctx.lineTo(CX+Math.cos(a)*ARENA, CY+Math.sin(a)*ARENA); ctx.stroke();
  }
  ctx.fillStyle = "rgba(255,255,255,.03)";
  ctx.beginPath(); ctx.arc(CX,CY,40,0,TAU); ctx.fill();
  ctx.restore();

  ctx.strokeStyle = boss ? accOf(boss) : "#c9a24a";
  ctx.globalAlpha = .42; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(CX,CY,ARENA,0,TAU); ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.strokeStyle = "rgba(0,0,0,.55)"; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.arc(CX,CY,ARENA+5,0,TAU); ctx.stroke();
}

function drawTeles(){
  for (const t of teles){
    const u = t.age/t.life, a = .30*(1-u) + .08;
    ctx.strokeStyle = "rgba(233,90,80," + a.toFixed(3) + ")";
    ctx.fillStyle = "rgba(178,58,52," + (a*.28).toFixed(3) + ")";
    ctx.lineWidth = 2; ctx.beginPath();
    if (t.kind === "ring"){ ctx.arc(t.x,t.y, t.r1*lerp(.55,1,u), 0, TAU); ctx.fill(); ctx.stroke(); }
    else { ctx.moveTo(t.x,t.y); ctx.arc(t.x,t.y,t.r1,t.ang-t.spread/2,t.ang+t.spread/2); ctx.closePath(); ctx.fill(); ctx.stroke(); }
  }
}

function drawHazards(){
  for (const h of hazards){
    if (h.kind === "arc"){
      if (h.age < h.delay){                                   // delayed strike telegraph
        const u = h.age/h.delay;
        ctx.strokeStyle = "rgba(233,90,80," + (.15+.3*u).toFixed(3) + ")"; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.moveTo(h.x,h.y);
        ctx.arc(h.x,h.y,h.r1,h.ang-h.spread/2,h.ang+h.spread/2); ctx.closePath(); ctx.stroke();
        continue;
      }
      const u = clamp((h.age-h.delay)/h.life,0,1), a = (1-u)*.85;
      ctx.strokeStyle = "rgba(255,240,220," + a.toFixed(3) + ")";
      ctx.lineWidth = (h.r1-h.r0)*(1-u*.55);
      ctx.beginPath(); ctx.arc(h.x,h.y, lerp(h.r0,h.r1,.5)+u*10, h.ang-h.spread/2, h.ang+h.spread/2); ctx.stroke();

    } else if (h.kind === "ring"){
      const u = h.r/h.rMax, a = (1-u)*.9;
      const c = h.col === "venom" ? "111,179,106" : "232,135,63";
      ctx.strokeStyle = "rgba(" + c + "," + a.toFixed(3) + ")"; ctx.lineWidth = h.thick*(1-u*.4);
      ctx.beginPath(); ctx.arc(h.x,h.y,h.r,0,TAU); ctx.stroke();
      ctx.strokeStyle = "rgba(255,240,220," + (a*.6).toFixed(3) + ")"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(h.x,h.y,h.r,0,TAU); ctx.stroke();

    } else if (h.kind === "orb"){
      const c = h.col === "mine"  ? ["rgba(255,255,245,.95)","rgba(201,162,74,.6)","rgba(201,162,74,0)"]
              : h.col === "venom" ? ["rgba(214,255,200,.95)","rgba(111,179,106,.55)","rgba(111,179,106,0)"]
                                  : ["rgba(255,226,190,.95)","rgba(232,135,63,.55)","rgba(232,135,63,0)"];
      const gl = ctx.createRadialGradient(h.x,h.y,1,h.x,h.y,h.r*2.4);
      gl.addColorStop(0,c[0]); gl.addColorStop(.45,c[1]); gl.addColorStop(1,c[2]);
      ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(h.x,h.y,h.r*2.4,0,TAU); ctx.fill();

    } else if (h.kind === "bloom"){
      if (!h.done){
        const u = clamp(h.age/h.delay,0,1);
        const c = h.leaves ? "111,179,106" : "232,135,63";
        ctx.strokeStyle = "rgba(" + c + "," + (.25+.55*u).toFixed(3) + ")"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(h.x,h.y,h.r,0,TAU); ctx.stroke();
        ctx.fillStyle = "rgba(" + c + ",.12)";
        ctx.beginPath(); ctx.arc(h.x,h.y,h.r*u,0,TAU); ctx.fill();
      } else {
        const u = clamp((h.age-h.delay)/.3,0,1);
        const gl = ctx.createRadialGradient(h.x,h.y,2,h.x,h.y,h.r*(1+u*.5));
        gl.addColorStop(0,"rgba(255,240,215," + (1-u).toFixed(3) + ")");
        gl.addColorStop(1, h.leaves ? "rgba(111,179,106,0)" : "rgba(232,135,63,0)");
        ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(h.x,h.y,h.r*(1+u*.5),0,TAU); ctx.fill();
      }

    } else if (h.kind === "pool"){
      const fade = clamp((h.life - h.age)/1.2, 0, 1);
      ctx.fillStyle = "rgba(72,120,66," + (.4*fade).toFixed(3) + ")";
      ctx.beginPath(); ctx.arc(h.x,h.y,h.r,0,TAU); ctx.fill();
      ctx.strokeStyle = "rgba(143,208,127," + (.4*fade).toFixed(3) + ")"; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(h.x,h.y,h.r,0,TAU); ctx.stroke();
      for (let k=0;k<3;k++){
        const a = h.bub + k*2.1 + game.time*1.3;
        const rr = (Math.sin(a)*.5+.5)*h.r*.7;
        ctx.fillStyle = "rgba(180,235,160," + (.3*fade).toFixed(3) + ")";
        ctx.beginPath(); ctx.arc(h.x+Math.cos(a*1.7)*rr, h.y+Math.sin(a*1.3)*rr*.7, 2.2, 0, TAU); ctx.fill();
      }

    } else { // beam
      const x2 = h.x + Math.cos(h.ang)*h.len, y2 = h.y + Math.sin(h.ang)*h.len;
      const fade = clamp(Math.min(h.age/.15, (h.life-h.age)/.25), 0, 1);
      const lg = ctx.createLinearGradient(h.x,h.y,x2,y2);
      lg.addColorStop(0,"rgba(255,236,200," + (.85*fade).toFixed(3) + ")");
      lg.addColorStop(1,"rgba(209,104,47,0)");
      ctx.strokeStyle = lg; ctx.lineWidth = 16*fade; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(h.x,h.y); ctx.lineTo(x2,y2); ctx.stroke();
      ctx.strokeStyle = "rgba(255,255,240," + (.9*fade).toFixed(3) + ")"; ctx.lineWidth = 3*fade;
      ctx.beginPath(); ctx.moveTo(h.x,h.y); ctx.lineTo(x2,y2); ctx.stroke();
    }
  }
}

function drawParts(){
  const C = { rust:"178,58,52", gold:"201,162,74", ember:"232,135,63", pale:"223,227,234", venom:"111,179,106" };
  for (const p of parts){
    const a = 1 - p.age/p.life;
    ctx.fillStyle = "rgba(" + (C[p.col] || C.pale) + "," + a.toFixed(3) + ")";
    ctx.beginPath(); ctx.arc(p.x,p.y,p.sz*a+.4,0,TAU); ctx.fill();
  }
}

function drawBoss(){
  const b = boss;
  const dying = b.dead ? clamp(b.deathT/1.7,0,1) : 0;
  ctx.save();
  ctx.globalAlpha = 1 - dying*.85;
  ctx.fillStyle = "rgba(0,0,0,.4)";
  ctx.beginPath(); ctx.ellipse(b.x, b.y+16, b.r*(1-(b.hop||0)/160), b.r*.42, 0, 0, TAU); ctx.fill();
  ctx.translate(b.x, b.y - (b.hop||0));
  b.def.render(b);
  ctx.restore();
}

function drawPlayer(){
  const p = player;
  const dying = (game.state === "dying" || game.state === "dead") ? clamp(game.endT/1.3,0,1) : 0;
  ctx.save();
  ctx.fillStyle = "rgba(0,0,0,.42)";
  ctx.beginPath(); ctx.ellipse(p.x,p.y+10,11,4.6,0,0,TAU); ctx.fill();
  ctx.translate(p.x,p.y);
  if (dying){ ctx.rotate(dying*1.2); ctx.globalAlpha = 1-dying*.6; }

  if (p.atk){
    const a = ATK[p.atk], tt = p.atkT;
    let sw;
    if (tt < a.wind) sw = lerp(-2.3,-1.6, tt/a.wind);
    else if (tt < a.wind+a.act) sw = lerp(-1.6,1.7, (tt-a.wind)/a.act);
    else sw = lerp(1.7,1.0, clamp((tt-a.wind-a.act)/a.rec,0,1));
    ctx.save(); ctx.rotate(p.ang + sw);
    ctx.strokeStyle = "#cfd8e6"; ctx.lineWidth = p.atk === "heavy" ? 4.5 : 3; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(4,0); ctx.lineTo(a.reach*.92,0); ctx.stroke();
    ctx.restore();
    if (tt >= a.wind && tt < a.wind+a.act){
      const u = (tt-a.wind)/a.act;
      ctx.strokeStyle = "rgba(223,227,234," + (.5*(1-u)).toFixed(3) + ")"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0,0,a.reach*.8, p.ang-1.6, p.ang + lerp(-1.6,1.7,u)); ctx.stroke();
    }
  }

  if (p.parry > 0 || p.parryFlash > 0){
    const live = parryActive();
    const a = p.parryFlash > .5 ? p.parryFlash : (live ? .9 : .3);
    ctx.save();
    ctx.strokeStyle = live || p.parryFlash > .5 ? "rgba(255,248,225," + clamp(a,0,1).toFixed(3) + ")"
                                               : "rgba(140,152,172,.35)";
    ctx.lineWidth = live ? 3.4 : 2;
    ctx.beginPath(); ctx.arc(0,0, 25, p.ang - PARRY.arc, p.ang + PARRY.arc); ctx.stroke();
    if (p.parryFlash > .4){
      ctx.strokeStyle = "rgba(201,162,74," + (p.parryFlash*.8).toFixed(3) + ")";
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(0,0, 25 + (1-p.parryFlash)*26, p.ang - PARRY.arc, p.ang + PARRY.arc); ctx.stroke();
    }
    ctx.restore();
  }

  ctx.rotate(p.ang + Math.PI/2);
  if (p.roll > 0){
    const u = 1 - p.roll/.48;
    ctx.scale(1 + .25*Math.sin(u*Math.PI), 1 - .3*Math.sin(u*Math.PI));
  }
  ctx.fillStyle = p.flash > .3 ? "#f4d6d2" : "#8d97a8";
  ctx.beginPath(); ctx.moveTo(0,-12); ctx.lineTo(9,10); ctx.lineTo(0,6); ctx.lineTo(-9,10); ctx.closePath(); ctx.fill();
  ctx.fillStyle = p.flash > .3 ? "#fff" : "#dfe3ea";
  ctx.beginPath(); ctx.arc(0,-4,4.6,0,TAU); ctx.fill();
  if (p.inv > 0 && p.roll > 0){
    ctx.strokeStyle = "rgba(201,162,74,.6)"; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(0,0,14,0,TAU); ctx.stroke();
  }
  if (p.heal > 0){ ctx.fillStyle = "rgba(201,162,74,.85)"; ctx.beginPath(); ctx.arc(7,0,3.4,0,TAU); ctx.fill(); }
  ctx.restore();
}

function bar(x,y,w,h,frac,fill){
  ctx.fillStyle = "rgba(0,0,0,.62)"; ctx.fillRect(x,y,w,h);
  ctx.fillStyle = fill; ctx.fillRect(x+1,y+1, Math.max(0,(w-2)*clamp(frac,0,1)), h-2);
  ctx.strokeStyle = "rgba(255,255,255,.16)"; ctx.lineWidth = 1; ctx.strokeRect(x+.5,y+.5,w-1,h-1);
}
function drawHUD(){
  const p = player, b = boss;
  ctx.save();
  ctx.textBaseline = "middle";
  ctx.font = "500 10px ui-sans-serif, Arial, sans-serif";

  bar(24,22,260,15, p.hp/PLAYER_MAX_HP, p.flash > .2 ? "#f0efe6" : "#b23a34");
  bar(24,42,210,9, p.stam/100, p.stamLock > 0 ? "#5c7f6a" : "#7fae90");
  ctx.fillStyle = "rgba(223,227,234,.55)";
  ctx.fillText(Math.ceil(p.hp) + " / " + PLAYER_MAX_HP, 292, 30);
  for (let i=0;i<game.flaskMax;i++){
    const x = 26 + i*20, y = 60;
    ctx.fillStyle = i < p.flasks ? "#c9a24a" : "rgba(201,162,74,.18)";
    ctx.beginPath(); ctx.moveTo(x+3,y); ctx.lineTo(x+11,y); ctx.lineTo(x+13,y+14); ctx.lineTo(x+1,y+14); ctx.closePath(); ctx.fill();
  }

  if (!(b.dead && b.deathT > 1.2)){
    const w = 430, x = CX-w/2, y = H-44;
    ctx.textAlign = "center";
    ctx.font = "400 11px ui-sans-serif, Arial, sans-serif";
    ctx.fillStyle = "rgba(223,227,234,.72)";
    const lab = labelOf(b);
    ctx.fillText(b.def.name.toUpperCase() + (lab ? "  ·  " + lab : ""), CX, y-10);
    ctx.textAlign = "left";
    bar(x,y,w,12, b.hp/b.maxHp, accOf(b));
    if (b.ward > 0){
      ctx.fillStyle = "rgba(232,176,79,.85)";
      ctx.fillRect(x, y+14, w*clamp(b.ward/b.wardMax,0,1), 3);
    } else if (b.poise > 0){
      ctx.fillStyle = "rgba(201,162,74,.7)";
      ctx.fillRect(x, y+14, w*clamp(b.poise/b.def.poiseMax,0,1), 2);
    }
    if (b.stagger > 0){
      ctx.textAlign = "center"; ctx.fillStyle = "#c9a24a";
      ctx.font = "500 10px ui-sans-serif, Arial, sans-serif";
      ctx.fillText("STAGGERED — CRITICAL", CX, y+26);
      ctx.textAlign = "left";
    }
  }
  ctx.restore();
}

// ═══════════════════════════════════════════ loop
let last = 0, acc = 0;
const STEP = 1/60;
function frame(ts){
  if (!last) last = ts;
  let dt = (ts-last)/1000; last = ts;
  if (dt > .25) dt = .25;
  if (dt < 0) dt = 0;              // guard against non-monotonic timestamps
  if (game.state !== "menu"){
    if (game.freeze > 0){ game.freeze -= dt; acc = 0; }      // brief hitstop on a clean parry
    else {
      acc += dt;
      let guard = 0;
      while (acc >= STEP && guard++ < 6){ update(STEP); acc -= STEP; }
      if (guard >= 6) acc = 0;
    }
  } else {
    game.time += dt;
    for (const e of embers){ e.y -= e.v*dt; if (e.y < -6){ e.y = H+6; e.x = rnd(0,W); } }
    for (let i = parts.length-1; i >= 0; i--){
      const p = parts[i]; p.age += dt;
      if (p.age >= p.life) parts.splice(i,1);
    }
  }
  draw();
  requestAnimationFrame(frame);
}

resetWorld("warden");
buildCards();
veil("vMenu");
requestAnimationFrame(frame);
})();
</script>
